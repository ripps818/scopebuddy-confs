# fsr-multi.conf: extra FSR 4 / DLSS upscalers as OptiScaler "custom" upscalers (commit de2626f1),
# each one its own entry in the DX12 upscaler list:
#   <prefix>/pfx/drive_c/windows/system32/umu/OptiScaler/custom/<name>/ffx/<dll>    (FFX api)
#   <prefix>/pfx/drive_c/windows/system32/umu/OptiScaler/custom/<name>/dlss/<dll>   (DLSS api)
#
# Kept up to date on launch (checked every FSRMULTI_CHECK_HOURS):
#   cyboman-*      zgauthier2000/fsr4-shader-performance-overrides, newest dll-* release, for
#                  FSR4_DLL_TARGET (default rx7000): exact, lossy, 4.1.2l-exact, 4.1.2l-lossy.
#                  Verified against the release's SHA256SUMS.
#   hlx-fsr4       lonewolf0622/HelixSR, newest release (pre-releases included): HLX-FSR4 DLL. Ships built.
#   hlx-dlss       the same release's HelixSR\helixsr.dll, only once the network is built into it
#                  (see below); until then it is left out.
#
# HLX DLSS NETWORK (once per HelixSR version): the ZIP's helixsr.dll has no network, so hlx-dlss is left out
# until it is built. The first launch downloads and unpacks the release into $HELIXSR_ROOT/<tag> (default
# ~/.local/share/scopebuddy-dlls/helixsr); build the network by hand (it asks before downloading NVIDIA's DLL; Enter on its
# own at the game list installs into no game):
#   ~/.local/share/scopebuddy-dlls/helixsr/<tag>/helixsr-setup.sh
# The next launch picks up the built DLL. FSRMULTI_HX_BUILD=1 runs that script itself in the background on the
# host (stdin closed, from Proton's cached DLSS 310.7.0 DLL). It is off because the script can fetch tools and
# its last step is the game installer.
#
# Per game (needs PROTON_USE_OPTISCALER=nightly):
#   export PROTON_USE_OPTISCALER=nightly
#   source $SCB_CONFIGDIR/fsr-multi.conf
# Don't combine with cyboman.conf in the same game. lib/optiscaler-reset.sh removes the
# custom folders at the start of every launch, so commenting the source line is enough to take them out.
#
# Settings (optional, above the source line):
#   FSR4_DLL_TARGET=rx7000      rx7000 | rx6000 | igpu-rdna3 | igpu-rdna2 (same as cyboman.conf)
#   FSRMULTI_CYBOMAN=0          skip the cyboman builds
#   FSRMULTI_HELIXSR=0          skip HelixSR
#   FSRMULTI_HX_BUILD=1         build HLX DLSS's network automatically on the host (off by default, see below)
#   FSRMULTI_CHECK_HOURS=24
# Logs to ~/.config/scopebuddy/fsr-multi.log

source "${SCB_CONFIGDIR:-$HOME/.config/scopebuddy}/lib/fsr-multi.sh" || true
