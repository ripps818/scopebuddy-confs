# Force FSR 4 (ML) frame generation instead of the FSR 3.1 FG fallback.
# Without OptiScaler: Proton's PROTON_MLFG_UPGRADE (also needs PROTON_FSR4_UPGRADE, see fsr4.conf).
# With OptiScaler nightly (PROTON_USE_OPTISCALER=nightly set above the source line): FSR.FGIndex=0
# (0 = FSR 4 FG, 1 = FSR 3.1.6 FG; auto picks FSR 3 on non-RDNA4). Proton clears its own
# MLFG upgrade in OptiScaler mode, so the ini setting is what counts there.
export PROTON_MLFG_UPGRADE=1
# RDNA3: FP8 -> FP16 WMMA conversion so the FSR 4 FG model can run.
export DXIL_SPIRV_CONFIG=wmma_rdna3_workaround
if [[ "${PROTON_USE_OPTISCALER:-}" == nightly* ]]; then
    PROTON_OPTISCALER_CONFIG="${PROTON_OPTISCALER_CONFIG:+$PROTON_OPTISCALER_CONFIG;}FSR.FGIndex=0"
    export PROTON_OPTISCALER_CONFIG
fi
