# ~/.config/scopebuddy/fsr4-sdk.conf
#
# AMD's official FSR 4 DLLs from the FidelityFX SDK repo
# (GPUOpen-LibrariesAndSDKs/FidelityFX-SDK, Kits/FidelityFX/signedbin: currently FSR 4.1.2),
# copied into the prefix's OptiScaler folder, so Proton's own OptiScaler uses them instead of the
# version it ships. Downloaded from GitHub on first use and refreshed when the repo's signedbin
# folder changes. Needs PROTON_USE_OPTISCALER=nightly set above the source line. Per game:
#   export PROTON_USE_OPTISCALER=nightly
#   source $SCB_CONFIGDIR/fsr4-sdk.conf
#
# Not needed with venom.conf or opennr.conf: their OptiScaler builds bring their own FSR DLLs.
#
# The DLLs live in ~/.local/share/scopebuddy-dlls/fsr4-sdk/ and are copied into
# <prefix>/pfx/drive_c/windows/system32/umu/OptiScaler (untracked by Proton, so its updates don't
# overwrite them). Forces OptiScaler onto the INT8 FSR 4 model (RDNA3) and turns on the low latency layer.
#
# Settings (optional, above the source line):
#   FSR4SDK_REF=main            git ref to download from: a tag (v2.4.0) or commit, to pin a version
#   FSR4SDK_CHECK_HOURS=24      how often the repo is checked for a newer build
#   FSR4SDK_CLEANUP=1           for one launch: remove the copied DLLs (only byte-identical ones), then drop the flag
#
# (fsr412.conf still works: it just sources this file.) Log: ~/.config/scopebuddy/fsr4-sdk.log

source "${SCB_CONFIGDIR:-$HOME/.config/scopebuddy}/lib/fsr4-sdk.sh" || true
