# Korthos low_latency_layer with the frame generation pacing patch (Korthos-Software/low_latency_layer PR #37,
# branch itchyfeetleech/low_latency_layer fg-sleep-pacing), built from ~/Projects/low_latency_layer-fg by
# ~/Projects/llayer-build/build.sh (run in the litterbox: litterbox enter claude -w ~/Projects/llayer-build -- 'bash ./build.sh').
# Replaces the system layer (/usr/lib/libVkLayer_KORTHOS_LowLatency.so) for the game: the same layer name is
# loaded from VK_ADD_IMPLICIT_LAYER_PATH, which the Vulkan loader searches first. Use it INSTEAD of
# LOW_LATENCY_LAYER=1 from fsr4.conf (same layer; that only sets the env var, so no conflict).
# Per game, above or below the other confs:
#   source $SCB_CONFIGDIR/llayer-fg.conf
# Settings (above the source line):
#   LLAYER_FG_PACING=0     don't set LOW_LATENCY_LAYER_FRAMEGEN_PACING (the patched layer, without the new pacing)
#   LLAYER_FG=off         use the system layer unchanged
# The PR is for DLSS-G (Streamline): whether it does anything with OptiScaler's FSR frame generation is untested.

source "${SCB_CONFIGDIR:-$HOME/.config/scopebuddy}/lib/llayer-fg.sh" || true
