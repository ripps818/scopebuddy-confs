# ~/.config/scopebuddy/cyboman.conf
#
# ScopeBuddy snippet for zgauthier2000/fsr4-shader-performance-overrides
# Faster FSR 4.1.1 (INT8) shaders: prepass, postpass, pass 11 and the other model
# passes, with AMD's image byte for byte (unless you pick a lossy build). Two ways
# to apply them:
#
#   override  vkd3d-proton loads replacement shaders (VKD3D_SHADER_OVERRIDE). Used
#             by auto when OptiScaler is off; the faster of the two. Needs AMD's
#             ORIGINAL amd_fidelityfx_upscaler_dx12.dll 4.1.1.2740.
#   dll       Used by auto when OptiScaler is on. Downloads the repo's patched DLL and points Proton-CachyOS's built-in
#             OptiScaler at it (Libraries.FfxDx12SRPath via PROTON_OPTISCALER_CONFIG).
#             Doesn't depend on how Proton translates shaders, and keeps vkd3d's
#             pipeline cache. Slightly slower than override on Linux per the repo.
#             Needs OptiScaler from Proton (PROTON_USE_OPTISCALER=1, or =nightly on
#             Proton-Wineland). If it can't be used, the game runs stock shaders.
#
# Measured on desktop RDNA3 + RADV; RDNA2/iGPU builds are experimental; NOT for RDNA4.
#
# ---------------------------------------------------------------------------
# SETUP
#
#   Nothing to install by hand. Override mode keeps the repo's shader sets (prebuilt/, prebuilt-lossy/,
#   tools/) in $SCB_DLLS/cyboman-repo, refreshed at most every FSR4_REPO_CHECK_HOURS:
#     - git installed: a shallow, sparse clone (one commit, only those folders), updated by fetching
#       that one commit again. An existing full clone there is git pulled instead.
#     - no git: GitHub's tarball (curl and tar), refreshed when the repo's latest commit changes.
#   Your own build in cyboman-repo/override/ is never touched. git is optional everywhere: the latest
#   release is found with git ls-remote, or the GitHub API without it. Also needs sha256sum, and
#   unzip/bsdtar/python3 for the lossy builds.
#
# The repo says to enable this per game, so DON'T source it from scb.conf. Per game,
# create ~/.config/scopebuddy/AppID/<appid>.conf with your settings ABOVE the source:
#
#     export PROTON_USE_OPTISCALER=1     # (or =nightly) only needed for dll mode
#     FSR4_MODE=dll                      # optional; auto picks dll when OptiScaler is on
#     source "$SCB_CONFIGDIR/cyboman.conf"
#
# Launch options stay `scb -- %command%`.
#
# Settings (all optional, put them above the source line):
#   (a PROTON_USE_OPTISCALER naming a version other than 4.1.1, e.g. 4.0.2, runs stock)
#   FSR4_MODE=auto | override | dll | dump | off  (default auto: dll if PROTON_USE_OPTISCALER
#       is set, else override; if dll can't be used, auto falls back to override; off = stock)
#
#   override mode:
#   FSR4_SET=auto | prebuilt | own | lossy (default auto: own if built, else prebuilt)
#   FSR4_OVERRIDE_DIR=/some/folder         (use this folder, ignore FSR4_SET)
#   FSR4_KEEP_DESCRIPTOR_HEAP=1            (don't strip it from VKD3D_CONFIG; see below)
#
#   dll mode:
#   FSR4_DLL_TARGET=rx7000                 (default) which GPU the DLL is built for:
#       rx7000 | rx6000 | igpu-rdna3 | igpu-rdna2
#       (igpu-rdna3 = 780M/880M/890M, also GeForce/Arc; igpu-rdna2 = Steam Deck, 680M)
#   FSR4_DLL_BUILD=exact                   (default; AMD's image, byte for byte; "main" is an alias)
#       lossy | 4.1.2l-exact | 4.1.2l-lossy   (lossy builds are faster, CHANGE THE IMAGE;
#                                              4.1.2l-exact = AMD Lite picture, byte for byte)
#   Needs a dll-2026-10-22 or newer release; older tags have no per-GPU builds.
#   FSR4_DLL_TAG=latest | dll-2026-10-13.2 (default latest = newest dll-* release)
#   FSR4_DLL_CHECK_HOURS=24                (how often "latest" is looked up)
#   FSR4_REPO_CHECK_HOURS=24               (override mode: how often the shader repo is checked for changes)
#
# Checking that prebuilt/ fits your setup (override mode). On some setups Proton
# translates AMD's shaders differently and prebuilt/ gives a wrong (darker) image
# with no error. This was seen once, on an RX 6900 XT in FF7 Rebirth. dll mode
# doesn't have this problem.
#   1. FSR4_MODE=dump, launch with FSR 4 on at your usual resolution/preset, get
#      into gameplay, wait a few seconds, quit.
#   2. cd $SCB_DLLS/cyboman-repo/tools
#      ./check_prebuilt.sh $SCB_DLLS/cyboman-dump/<appid>
#   3. If shaders differ: ./build_override.sh $SCB_DLLS/cyboman-dump/<appid>
#      (needs python3 + spirv-tools); override/ is then used for every game.
#
# FSR4_SET=lossy uses prebuilt-lossy/ in the downloaded repo (updated automatically). Lossy builds are softer, run
# the model every other frame (edges behind moving objects lag one frame), and
# frame times alternate short/long. See the repo's WARNING.txt.
#
# VKD3D_CONFIG=descriptor_heap (e.g. from scb.conf) changes how vkd3d-proton
# translates shaders, so the prebuilt/ and lossy sets don't fit it. On
# Proton-Wineland (vkd3d-proton 3.1) FF16 crashed in RADV when the prebuilt prepass
# was loaded. So in override and dump mode this conf REMOVES descriptor_heap from
# VKD3D_CONFIG for the game (other VKD3D_CONFIG options are kept). dll and off mode
# leave it alone, since dll swaps the shaders before vkd3d-proton translates them.
# Set FSR4_KEEP_DESCRIPTOR_HEAP=1 to keep it; override mode then only uses your own
# build (dumped with descriptor_heap on) or FSR4_OVERRIDE_DIR, else stock shaders.
#
# Everything is logged to ~/.config/scopebuddy/cyboman.log

source "${SCB_CONFIGDIR:-$HOME/.config/scopebuddy}/lib/cyboman.sh" || true
