# ~/.config/scopebuddy/luma.conf
#
# ScopeBuddy snippet for Filoppi/Luma-Framework: per-game HDR / rendering mods built on ReShade's addon
# system. Each game has its own zip in the rolling "latest-N" GitHub release (Luma-<Game>.zip), which is
# extracted next to the game exe (dxgi.dll = ReShade + Luma-<Game>.addon + Luma/ shaders).
# Proton needs no extra setup (the release notes say so), but dxgi must load as the native DLL: this sets
# WINEDLLOVERRIDES=dxgi=n,b.
#
# With OptiScaler on (PROTON_USE_OPTISCALER set, as in fsr4.conf / fsr-multi.conf) the two would fight over
# dxgi.dll. Then the Luma package is installed in the prefix's system32/umu (next to Proton's OptiScaler) with its dxgi.dll renamed
# ReShade64.dll instead, no dxgi override is set, and
# Plugins.LoadReshade=true makes OptiScaler load it (the method from OptiScaler's Luma wiki page).
# Source this AFTER setting PROTON_USE_OPTISCALER. Then pick DLSS as the Super Resolution in the Luma menu.
#
# Per game, in its AppID conf:
#   LUMA_MOD=Dishonored_2          which mod (asset name without "Luma-" and ".zip"; see below)
#   source "$SCB_CONFIGDIR/luma.conf"
#
# Settings (set above the source line):
#   LUMA_MOD=<name>      the mod. Case, "_", "-", spaces and punctuation are ignored: "dishonored 2" works.
#                        "generic" means Generic_Mod. If unset, it is guessed from the game's install folder name
#                        (exact match only, Generic_Mod is never guessed). If that finds nothing, the engine is detected:
#                        UnityPlayer.dll -> Unity_Engine (the x32 build for a 32-bit player), a *-Shipping.exe or
#                        Content/Paks or Engine/Binaries -> Unreal_Engine. Otherwise it is logged and nothing is installed.
#   LUMA_ENGINE=off      turn that engine detection off
#   LUMA_TEST=1          use the "-Test" build (investigation tools, more logging)
#   LUMA_DEV=1           use the "-Dev" build (only some mods have one)
#   LUMA_X32=1           use the 32-bit "-x32" build when a mod has both (mods that only have x32 pick it automatically)
#   LUMA_MODE=off        remove what was installed from the game folder (once), instead of installing
#   LUMA_CHECK_HOURS=24  how often the release is checked for a newer build
#   LUMA_D3D12_DEVICE=1  OptiScaler mode only: Hotfix.CreateD3D12DeviceForLuma=true, for crashes / "non-DX11 device"
#                        warnings (the wiki suggests it on Linux if needed)
#   LUMA_OPTI_DIR=umu    OptiScaler mode: where Luma goes. umu (default): the prefix's system32/umu, next to
#                        Proton's OptiScaler, as OptiScaler's wiki says. game: the exe folder, a last resort if
#                        OptiScaler doesn't pick it up from umu. both: install in each.
#   LUMA_GAME_DIR=<dir>  install here instead of the folder SCB_GetGameDir finds (the dir with the game's .exe)
#
# List the available mods:   grep -o '"name": *"Luma-[^"]*' ~/.local/share/scopebuddy-dlls/luma/release.json
# (or the wiki mod list: not all mods are playable, some are work in progress).
# Don't combine with opennr.conf (it also takes dxgi.dll). In plain mode, if the game folder
# already has a different dxgi.dll it is saved as dxgi.dll.pre-luma and put back by LUMA_MODE=off.
# Press Home in the game for the ReShade / Luma menus. Log: ~/.config/scopebuddy/luma.log

source "${SCB_CONFIGDIR:-$HOME/.config/scopebuddy}/lib/luma.sh" || true
