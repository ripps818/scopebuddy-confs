# FSR 4.1.2 official AMD DLLs (FidelityFX-SDK Kits/FidelityFX/signedbin) for Proton's OptiScaler nightly.
# Needs PROTON_USE_OPTISCALER=nightly set above the source line. Per game:
#   export PROTON_USE_OPTISCALER=nightly
#   source $SCB_CONFIGDIR/fsr412.conf
# DLLs live in ~/.local/share/scopebuddy-dlls/fsr4-4.1.2/; they are copied into the prefix's
# OptiScaler folder (untracked by Proton, so not overwritten by its updates).

source "${SCB_CONFIGDIR:-$HOME/.config/scopebuddy}/lib/fsr412.sh" || true
