# ~/.config/scopebuddy/opennr.conf
#
# ScopeBuddy snippet for MatheusFerreiraS/OpenNR-OptiScaler: an OptiScaler fork with
# DLSS 5 neural rendering (NR) bridged to AMD runtimes, FSR ray reconstruction (FSR-RR)
# and XeSS multi frame generation (XeFG) on AMD.
#
# This is a full OptiScaler build, installed as a proxy DLL in the game folder (what its
# Setup.bat does), NOT through Proton's built-in OptiScaler. This conf unsets
# PROTON_USE_OPTISCALER for the game so the two don't inject twice.
#
# What this does on every launch:
#   - downloads the latest release into $OPENNR_ROOT/<tag> (checked once per
#     OPENNR_CHECK_HOURS, verified against GitHub's sha256)
#   - copies OptiScaler.dll (as $OPENNR_PROXY), OptiScaler/ and shaders/ next to the
#     game exe when the installed tag differs; OptiScaler.ini is only copied if missing,
#     so your edits survive updates
#   - copies backend files from $OPENNR_ROOT/backend/ if present (see below)
#   - sets WINEDLLOVERRIDES=<proxy>=n,b
#
# ---------------------------------------------------------------------------
# NR BACKEND (the release ships none of the neural runtimes or weights)
#
#   danielblnc (RDNA3/RDNA4, HIP 7): put in $OPENNR_ROOT/backend/
#       dlssnr_amd_pass1.dll  (danielblnc's version.dll, renamed; pass2/pass3 are
#       copied from it)  and  dlssnr_on_amd_weights.bin
#   lmxxf (RDNA4 only): not handled here.
#
# NR needs AMD's HIP runtime on Windows; whether that works under Wine/Proton is
# untested. FSR-RR and XeFG don't depend on it.
#
# Per game, ~/.config/scopebuddy/AppID/<appid>.conf:
#
#     source "$SCB_CONFIGDIR/opennr.conf"
#
# In game press Insert, open the Neural tab, turn on Enable NR.
#
# Settings (optional, above the source line):
#   OPENNR_MODE=on | off          (off = remove the proxy from the game folder)
#   OPENNR_PROXY=dxgi.dll         (dxgi.dll, winmm.dll, version.dll, ...)
#   OPENNR_CHECK_HOURS=24
#   OPENNR_NR_BACKEND=daniel      (written to OptiScaler.ini NrBackend; unset = leave alone)
#
# Logs to ~/.config/scopebuddy/opennr.log
# ---------------------------------------------------------------------------

source "${SCB_CONFIGDIR:-$HOME/.config/scopebuddy}/lib/opennr.sh" || true
