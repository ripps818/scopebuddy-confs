# opti_config Section.Key=value ...  -> appends to PROTON_OPTISCALER_CONFIG
# Call it as often as you like; later settings for the same key win.
opti_config() {
    local opt
    for opt in "$@"; do
        if [[ "$opt" =~ ^[A-Za-z0-9_]+\.[A-Za-z0-9_]+=[^\;=]*$ ]]; then
            PROTON_OPTISCALER_CONFIG="${PROTON_OPTISCALER_CONFIG:+$PROTON_OPTISCALER_CONFIG;}$opt"
        else
            echo "opti_config: ignoring malformed '$opt' (want Section.Key=value)" >&2
        fi
    done
    export PROTON_OPTISCALER_CONFIG
}

source "$SCB_CONFIGDIR/lib/optiscaler-reset.sh" || true

#export WINE_CPU_TOPOLOGY="8:2,3,4,5,6,7,8,9"
export MANGOHUD_CONFIG=full

# Enable auto-detection for resolution, HDR, and VRR
SCB_AUTO_RES=1
SCB_AUTO_HDR=1
SCB_AUTO_VRR=1
#SCB_AUTO_REFRESH=1
#SCB_AUTO_FRAME_LIMIT=1

#command="game-performance $command"

if [ "$SUNSHINE_CLIENT_HDR" == "false" ]; then
	echo "Disable HDR"
	export DXVK_HDR=0
	export PROTON_ENABLE_HDR=0
else
	echo "Enable HDR"
	export SCB_AUTO_HDR=1
	export DXVK_HDR=1
	export PROTON_ENABLE_HDR=1
	SCB_GAMESCOPE_ARGS+=" --hdr-enabled"
fi

[[ -n "${PROTON_USE_OPTISCALER:-}" ]] && source "$SCB_CONFIGDIR/lib/optipatcher.sh"
export SCB_GAMESCOPE_ARGS+=" --fullscreen --mangoapp"