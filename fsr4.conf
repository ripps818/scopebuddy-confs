# Enable Vulkan Anti-Lag 2 / Low Latency layer
export LOW_LATENCY_LAYER=1
export PROTON_FSR4_UPGRADE=1

# Fsr4GpuSupport=2 forces OptiScaler onto the high quality INT8 model (RDNA3 is
# otherwise detected as FSR 4-unsupported and falls back to FSR 3.1).
case "${PROTON_OPTISCALER_CONFIG:-}" in
    *FSR.Fsr4GpuSupport=*) ;;
    *)
        PROTON_OPTISCALER_CONFIG="${PROTON_OPTISCALER_CONFIG:+$PROTON_OPTISCALER_CONFIG;}FSR.UpscalerIndex=0;FSR.Fsr4GpuSupport=2"
        export PROTON_OPTISCALER_CONFIG
        ;;
esac
