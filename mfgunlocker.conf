# Universal MFG Unlocker (dashdogy/MFG-Unlocker) as an OptiScaler plugin, for XeMFG (up to 6x).
# Needs PROTON_USE_OPTISCALER=nightly (an OptiScaler 10 build) set above the source line.
# Switches FG output to XeFG, so don't combine it with FSR FG in mlfg.conf. Per game:
#   export PROTON_USE_OPTISCALER=nightly
#   source $SCB_CONFIGDIR/mfgunlocker.conf
# Options (set above the source line):
#   MFGUNLOCKER_TAG=v1.6.1   pin a release (default: the latest GitHub release)
#   MFGUNLOCKER_CHECK_HOURS=24   how often the latest release is looked up
#   MFGUNLOCKER_REMOVE=1     take it out of this prefix (once) instead of installing it
# The DLL is cached in ~/.local/share/scopebuddy-dlls/mfg-unlocker/ and copied as MFGUnlocker.asi into the
# prefix's umu/plugins folder: the same one lib/optipatcher.sh uses, set explicitly via
# Plugins.Path so stable and nightly layouts both load from it.

source "${SCB_CONFIGDIR:-$HOME/.config/scopebuddy}/lib/mfgunlocker.sh" || true
