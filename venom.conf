# ~/.config/scopebuddy/venom.conf
#
# ScopeBuddy snippet for LorenzoKy/Optiscaler-Venom: a community build of OptiScaler that follows
# upstream and adds OSD rows / graphs (latency, FG time, bottleneck, VRAM, GPU, CPU, RAM), the
# Venom OSD presets and more. With default settings it behaves like upstream OptiScaler.
#
# This is a full OptiScaler build. It is NOT put in the game folder: it overwrites Proton's own
# OptiScaler in the prefix (system32/umu), so nothing is written next to the game exe. The conf
# sets PROTON_USE_OPTISCALER=1 itself if it isn't set above the source line (1 or nightly both work).
#
# What this does on every launch:
#   - downloads the newest build into $VENOM_ROOT/<tag> (checked once per VENOM_CHECK_HOURS,
#     verified against the release's .sha256)
#   - Proton installs and md5-checks its own OptiScaler first. A background loop (lib/common.sh,
#     scb_umu_start) waits for wineserver, then copies Venom's OptiScaler.dll, OptiScaler/ and
#     shaders/ over Proton's, plus symlinks for the nvngx/fakenvapi DLLs. OptiScaler.ini is never
#     touched (Proton writes PROTON_OPTISCALER_CONFIG into it). The loop ends when wine exits, or
#     after VENOM_UMU_SECONDS (default 180).
#   - sets LOW_LATENCY_LAYER=1 (like fsr4.conf); LOW_LATENCY_LAYER=0 above the source line turns it off
#   - removes a game-folder install left by an older version of this conf
#
# Per game, ~/.config/scopebuddy/AppID/<appid>.conf:
#
#     source "$SCB_CONFIGDIR/venom.conf"
#
# In game press Insert for the menu (FPS Overlay has the Venom rows).
#
# It is timing-based: check venom.log for "Venom <tag> in place after Ns" and the OSD / OptiScaler.log.
# Proton puts its own files back on the next launch without the conf, so no cleanup is needed.
#
# Settings (optional, above the source line):
#   VENOM_MODE=on | off           (off = leave Proton's own OptiScaler alone)
#   VENOM_CHANNEL=release         release (default, stable v0.x) | nightly (newest build, untested)
#   VENOM_TAG=<tag>               pin one release, e.g. opti-venom-v0.3 (overrides the channel)
#   VENOM_UMU_SECONDS=180         (umu mode: how long the overwrite loop runs)
#   VENOM_PROXY=dxgi.dll          (dxgi.dll, winmm.dll, version.dll, ...)
#   VENOM_CHECK_HOURS=24
#   LOW_LATENCY_LAYER=0           (on by default whenever VENOM_MODE=on, like fsr4.conf; 0 turns it off)
#
# CPU temperature / power in the OSD need a sensor app (HWiNFO etc.) on Windows; they don't
# work under Wine, so the CPU row shows only clock and usage. GPU sensors work on their own.
# Don't combine with opennr.conf (same proxy DLL) or luma.conf's plain dxgi mode.
#
# Report Venom problems at https://github.com/LorenzoKy/Optiscaler-Venom/issues, not to OptiScaler.
# Logs to ~/.config/scopebuddy/venom.log

source "${SCB_CONFIGDIR:-$HOME/.config/scopebuddy}/lib/venom.sh" || true
